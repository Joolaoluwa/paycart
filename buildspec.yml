version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing dependencies...
      - npm install

  build:
    commands:
      - echo Zipping Lambda functions...

      - zip -r createOrder.zip node_modules/ && zip -j createOrder.zip createOrder/index.mjs
      - zip -r getOrder.zip node_modules/ && zip -j getOrder.zip getOrder/index.mjs
      - zip -r updateOrder.zip node_modules/ && zip -j updateOrder.zip updateOrder/index.mjs

  post_build:
    commands:
      - echo Deploying to AWS Lambda...

      - aws lambda update-function-code
        --function-name createOrder
        --zip-file fileb://createOrder.zip

      - aws lambda update-function-code
        --function-name getOrder
        --zip-file fileb://getOrder.zip

      - aws lambda update-function-code
        --function-name updateOrder
        --zip-file fileb://updateOrder.zip

      - echo Deployment complete.

artifacts:
  files:
    - createOrder.zip
    - getOrder.zip
    - updateOrder.zip
